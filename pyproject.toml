[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tier-triage"
version = "0.1.0"
description = "Deterministic storage-tier decision and migration orchestration for a local data lake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "Flask>=3.0",
]
license = {text = "Proprietary"}
authors = [{name = "Local Data Platform Team"}]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tier-triage = "tier_triage.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tier_triage*"]

[tool.setuptools.package-data]
"tier_triage.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
